# Leakage-safe parameter screening plan (Stage 1: development only).

# Formal manuscript results require results/screening/locked_final_config.json (Stage 2).



stage: screening

not_formal_test: true



relabel:

  microbio_csv: data/microbio_raw/MICROBIO.csv

  fixed_top_k: 8

  drop_infeasible_profiles: true

  acceptable_threshold: 12.0

  scoring_weights:

    w_pauc: 3.0

    w_dose: 0.05

    w_threshold: 0.01

    w_constraint: 1.0

  lr_metric: terminal_median

  pauc_quantiles: [0.25, 0.50, 0.75]

  lr_quantiles: [0.25, 0.50, 0.75]



training:

  split_mode: group

  group_col: bio_id

  test_size: 0.2

  inner_cv_folds: 3

  screening_seed: 42

  same_search_budget_for_all_models: true

  selected_metric: mean_R2_original

  target_transform: log

  models: [TAR, RandomForest, BestSingleTree, UniformTreeMean]

  tar_grid:

    expanded_tree_bank: [false, true]

    max_tree_experts: [3, 6, 10]

  rf_grid:

    n_estimators: [200, 500]

    max_depth: [null, 12]

    min_samples_leaf: [1, 5]

  tree_controls_share_tar_expert_bank: true



umax_weights:

  main_profile: balanced

  u_grid: arange:0:101:1

  profiles:

    balanced: {w_track: 1.0, w_path: 1.0, w_probiotic: 1.0, w_dose: 0.25}

    efficacy: {w_track: 1.0, w_path: 2.0, w_probiotic: 1.0, w_dose: 0.25}

    probiotic_sparing: {w_track: 1.0, w_path: 1.0, w_probiotic: 2.0, w_dose: 0.25}

    dose_sparing: {w_track: 1.0, w_path: 1.0, w_probiotic: 1.0, w_dose: 1.0}

  apply_to_all_models: true

  apply_to_all_policies: true

  fixed_umax_policies_training_only: true

  optimizer_selection_rule: constraint_first

  # Development-only fast path for pipeline step 5b (does not affect step 10 / locked config).
  sensitivity:
    n_repeats: 10
    repeat_subsample: even
    u_grid: arange:0:101:2
    ablation_conditions:
      - TAR_optimized
      - RF_optimized
    share_dose_references: true
    skip_score_landscape: true
    skip_representative_trajectories: true

locked_config_output: results/screening/locked_final_config.json

fairness_check_output: results/screening/fairness_check.json

screening_results_root: results/screening

